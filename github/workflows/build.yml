name: Build Garden Tracker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unpack the project zip
        run: |
          # Find the zip anywhere in the repo (not just the top level).
          mapfile -t ZIPS < <(find . -path ./.git -prune -o -iname '*.zip' -print)
          echo "Zip files found: ${#ZIPS[@]}"
          printf '  %s\n' "${ZIPS[@]}"
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::No .zip file in the repo. Upload GardenTracker-v3.zip with Add file > Upload files."
            exit 1
          fi
          if [ ${#ZIPS[@]} -gt 1 ]; then
            echo "::error::More than one .zip in the repo. Delete the old ones so only the newest is left."
            exit 1
          fi
          rm -rf work && mkdir work
          unzip -q "${ZIPS[0]}" -d work
          BUILD_FILE="$(find work -name build.gradle | head -1)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::The zip doesn't contain the project (no build.gradle inside)."
            exit 1
          fi
          echo "PROJ=$(dirname "$BUILD_FILE")" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: |
          cd "$PROJ"
          gradle build --stacktrace

      - name: Check the jar has the mod inside
        run: |
          JAR="$(ls "$PROJ"/build/libs/*.jar | grep -v sources | head -1)"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "fabric.mod.json" || { echo "fabric.mod.json missing"; exit 1; }
          unzip -l "$JAR" | grep -q "dev/vito/gardentracker/GardenTracker.class" || { echo "mod code missing"; exit 1; }

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: GardenTracker-jar
          path: |
            ${{ env.PROJ }}/build/libs/*.jar
            !${{ env.PROJ }}/build/libs/*-sources.jar
